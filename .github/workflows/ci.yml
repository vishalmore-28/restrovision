name: RESTROVISION v2.0 CI/CD Pipeline

on:
  push:
    branches:
      - main
      - feature/production-hardening
      - 'feature/**'
  pull_request:
    branches:
      - main
      - feature/production-hardening

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-test:
    name: Backend Test & Build (Java 21 / Spring Boot)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Backend

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'

      - name: Compile and Execute Tests
        run: mvn -B clean test
        env:
          SPRING_PROFILES_ACTIVE: default

      - name: Package Backend Jar
        run: mvn -B package -DskipTests

      - name: Archive Test Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports
          path: Backend/target/surefire-reports/
          retention-days: 14

  frontend-test:
    name: Frontend Test & Build (Node 22 / Vite 6 / React)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install Dependencies
        run: npm ci

      - name: Execute Vitest Suite
        run: npm run test

      - name: Build Production Assets
        run: npm run build

      - name: Verify Dist Output
        run: test -f dist/index.html

  edge-ai-test:
    name: Edge AI Test Suite (Python 3.11 / FastAPI / Pytest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: edge-ai

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-cov

      - name: Execute Pytest Suite
        run: python -m pytest -v --cov=app
        env:
          PYTHONPATH: .

  security-audit:
    name: Security Vulnerability Scan (npm & pip)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Frontend Dependency Audit
        working-directory: frontend
        run: npm audit --omit=dev

      - name: Set up Python 3.11
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Edge AI Dependency Audit
        working-directory: edge-ai
        run: |
          python -m pip install --upgrade pip
          pip install pip-audit
          pip-audit -r requirements.txt

  docker-compose-validate:
    name: Docker & Container Configuration Validation
    needs: [backend-test, frontend-test, edge-ai-test]
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Validate Docker Compose Configuration
        run: docker compose config --quiet
