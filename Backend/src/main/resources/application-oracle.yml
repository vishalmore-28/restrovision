spring:
  config:
    activate:
      on-profile: oracle
  datasource:
    url: jdbc:oracle:thin:@${ORACLE_HOST:localhost}:${ORACLE_PORT:1521}/${ORACLE_SERVICE:freepdb1}
    driver-class-name: oracle.jdbc.OracleDriver
    username: ${ORACLE_USERNAME}
    password: ${ORACLE_PASSWORD}
  flyway:
    enabled: true
    baseline-on-migrate: true
    baseline-version: 1
    locations: classpath:db/migration
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.OracleDialect

# Production Security Requirements: Mandatory Environment Secrets (No Fallbacks)
restrovision:
  jwt:
    secret: ${RESTROVISION_JWT_SECRET}
  edge:
    hmac-secret: ${RESTROVISION_HMAC_SECRET}
  security:
    cookie:
      secure: ${RESTROVISION_COOKIE_SECURE:true}
